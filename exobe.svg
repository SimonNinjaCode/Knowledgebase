<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="ringGradient" x1="70%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%"   stop-color="#f0960a"/>
      <stop offset="30%"  stop-color="#8b2fe8"/>
      <stop offset="70%"  stop-color="#2a0fdc"/>
      <stop offset="100%" stop-color="#1a0ab8"/>
    </linearGradient>
    <mask id="ringMask">
      <circle cx="150" cy="150" r="112" fill="white"/>
      <circle cx="150" cy="150" r="58"  fill="black"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
  </defs>
  <circle cx="150" cy="150" r="112" fill="url(#ringGradient)" mask="url(#ringMask)" filter="url(#glow)"/>
</svg>
